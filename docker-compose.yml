services:
  mysql:
    image: mysql:8.0
    container_name: fixlynk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fixlynk
      MYSQL_USER: fixlynk
      MYSQL_PASSWORD: fixlynk_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3307:3306"
    volumes:
      - fixlynk_mysql_data:/var/lib/mysql

volumes:
  fixlynk_mysql_data:
