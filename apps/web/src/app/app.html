<header class="fl-header">
  <div class="fl-header-inner">
    <a class="fl-brand" routerLink="/" aria-label="FixLink home">
      <img
        ngSrc="brand/fixlink-logo.png"
        width="132"
        height="44"
        priority
        alt="FixLink"
        class="fl-brand-logo"
      />
    </a>
    <nav class="fl-nav" aria-label="Primary">
      @if (auth.isRestoring()) {
        <span class="fl-nav-status" role="status">Checking session…</span>
      } @else if (auth.isAuthenticated() && auth.currentUser()) {
        <span class="fl-nav-status">{{ auth.currentUser()?.email }}</span>
        <a class="fl-btn fl-btn-secondary fl-btn-sm" routerLink="/account">My account</a>
      } @else {
        <a class="fl-btn fl-btn-secondary fl-btn-sm" routerLink="/login">Log in</a>
        <a class="fl-btn fl-btn-primary fl-btn-sm" routerLink="/register">Sign up</a>
      }
    </nav>
  </div>
</header>

<main class="fl-main">
  <router-outlet />
</main>

<footer class="fl-footer">
  <p>FixLink — Connect. Quote. Fix. · Payment is arranged directly with your professional.</p>
</footer>
